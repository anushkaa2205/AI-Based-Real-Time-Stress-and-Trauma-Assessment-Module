[project]
name = "nhaa-analysis-service"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# Prompt text: line breaks are part of what the model reads
"app/text/prompt.py" = ["E501"]
